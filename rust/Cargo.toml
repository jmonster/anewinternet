[workspace]
resolver = "2"
members = ["cw-crypto", "cw-host", "commonwire", "cw-conformance"]

[workspace.package]
edition = "2021"
rust-version = "1.95"
publish = false

[workspace.dependencies]
tls_codec = { version = "0.4.2", features = ["derive", "std"] }
aes-gcm = "0.10.3"
aes = "0.8.4"
ctr = "0.9.2"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2.0.1", features = ["zeroize"] }
rand = "0.8.5"
zeroize = "1.8"
subtle = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_chacha = "0.3.1"
libcrux-ml-kem = { version = "0.0.12", default-features = false, features = ["mlkem768"] }
libcrux-ml-dsa = { version = "0.0.12", default-features = false, features = ["mldsa44"] }
libcrux-sha3 = "0.0.12"
wasm-bindgen = "=0.2.126"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Native hosts are built for speed; WASM keeps the size-optimized release profile.
[profile.native]
inherits = "release"
opt-level = 3

# tls_codec debug-asserts on truncated input; release builds return an error, and tests must see the same.
[profile.dev.package.tls_codec]
debug-assertions = false
