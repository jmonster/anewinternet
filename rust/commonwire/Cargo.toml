[package]
name = "commonwire"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cw-crypto = { path = "../cw-crypto" }
cw-host = { path = "../cw-host" }
serde_json.workspace = true
rand.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "signal", "io-util"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
futures = "0.3"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
http = "1"
http-body = "1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-acme = { version = "0.15", default-features = false, features = ["tokio", "ring", "tls12", "webpki-roots"] }
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
